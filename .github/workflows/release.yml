name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    name: Freeze (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            path: dist/AvatarToPlayermodel.exe
          - os: ubuntu-latest
            artifact: linux
            path: dist/AvatarToPlayermodel
          - os: macos-15
            artifact: macos
            path: AvatarToPlayermodel-macos.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install GTK so the Linux freeze can import pywebview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          sudo apt-get install -y libgirepository1.0-dev || sudo apt-get install -y libgirepository-2.0-dev

      - name: Install and freeze
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then
            venv_python=.venv/bin/python
          else
            venv_python=.venv/Scripts/python.exe
          fi
          "$venv_python" -m pip install -r requirements-dev.txt
          if [ "$(uname -s)" = "Linux" ]; then
            "$venv_python" -m pip install PyGObject
          fi
          python scripts/packaging/freeze.py
          if [ "$(uname -s)" = "Linux" ]; then
            chmod +x dist/AvatarToPlayermodel
          fi

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/AvatarToPlayermodel.app AvatarToPlayermodel-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: freeze
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("notes.md").write_text(
              "Windows: `AvatarToPlayermodel.exe`\n"
              "Linux: `AvatarToPlayermodel` (built on Ubuntu; `chmod +x` if the download is not executable)\n"
              "macOS: unzip `AvatarToPlayermodel-macos.zip`. Control-click the app and choose Open the first time.\n"
              "\n"
              "`data/` is created next to the app on first launch. It is not in these files.\n"
          )
          PY
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "$tag" --notes-file notes.md
          fi
