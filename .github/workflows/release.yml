name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    name: Freeze (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            path: dist/AvatarToPlayermodel.exe
          - os: ubuntu-latest
            artifact: linux
            path: dist/AvatarToPlayermodel
          - os: macos-15
            artifact: macos
            path: AvatarToPlayermodel-macos.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install GTK so the Linux freeze can import pywebview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install and freeze
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then
            venv_python=.venv/bin/python
          else
            venv_python=.venv/Scripts/python.exe
          fi
          "$venv_python" -m pip install -r requirements-dev.txt
          if [ "$(uname -s)" = "Linux" ]; then
            "$venv_python" -m pip install PyGObject
          fi
          python scripts/packaging/freeze.py
          if [ "$(uname -s)" = "Linux" ]; then
            chmod +x dist/AvatarToPlayermodel
          fi

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/AvatarToPlayermodel.app AvatarToPlayermodel-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: freeze
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Windows: `AvatarToPlayermodel.exe`
            Linux: `AvatarToPlayermodel` (built on Ubuntu; `chmod +x` if the download is not executable)
            macOS: unzip `AvatarToPlayermodel-macos.zip`. Control-click the app and choose Open the first time.

            `data/` is created next to the app on first launch. It is not in these files.
