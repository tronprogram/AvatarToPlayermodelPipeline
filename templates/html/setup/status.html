{{ log }}
{% if state == 'failed' %}
<p>{{ error }}</p>
<a class="cmd fill" href="/setup/fatal">See error</a>
{% endif %}
{% if oob_continue %}
<button
  id="install-continue"
  class="cmd fill"
  type="submit"
  form="after-install"
  {% if state != 'succeeded' %}disabled{% endif %}
  hx-swap-oob="outerHTML"
>Continue</button>
{% endif %}
