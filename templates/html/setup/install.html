{% extends "base.html" %}

{% block content %}
<div class="stage">
  <h1 class="metro-title">System setup</h1>
  <p class="lede">Please wait while the system installs the dependencies...</p>
  <div
    class="panel log"
    id="install-log"
    hx-get="/setup/install/status"
    hx-trigger="load, every 1s"
    hx-swap="innerHTML"
    hx-on::after-swap="this.scrollTop = this.scrollHeight"
  >{% include "setup/status.html" %}</div>
  <div class="commands">
    <a class="cmd" href="/setup/canceled">Cancel</a>
    <form id="after-install" method="post" action="/setup/after-install">
      <button
        id="install-continue"
        class="cmd fill"
        type="submit"
        {% if not ready %}disabled{% endif %}
      >Continue</button>
    </form>
  </div>
</div>
{% endblock %}
