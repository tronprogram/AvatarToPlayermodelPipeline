{% extends "base.html" %}

{% block content %}
<div class="stage">
  <h1 class="metro-title">Convert</h1>
  <p class="lede">Please wait while the system converts the 360sona...</p>
  <div
    class="panel log"
    id="convert-log"
    hx-get="/convert/status/{{ job_id }}"
    hx-trigger="load, every 1s"
    hx-swap="innerHTML"
  >{% include "convert/status.html" %}</div>
  <div class="commands">
    <a class="cmd" href="/convert/canceled">Cancel</a>
    <a class="cmd fill" href="/convert/result/{{ job_id }}" {% if state != 'succeeded' %}style="pointer-events:none;opacity:.35"{% endif %}>Continue</a>
  </div>
</div>
{% endblock %}
