<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or app_name }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='img/mark.svg') }}">
    <link href="{{ url_for('static', path='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/bootstrap-icons.min.css') }}">
    <link href="{{ url_for('static', path='css/styles.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/alpine.min.js') }}" defer></script>
  </head>
  <body>
    <div id="loading-bar" class="htmx-indicator" aria-hidden="true"></div>
    {% include "partials/common/header.html" %}
    <main class="container py-4">
      <div id="global-alerts" aria-live="polite"></div>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
