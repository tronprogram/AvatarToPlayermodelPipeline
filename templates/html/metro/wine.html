{% extends "base.html" %}
{% from "partials/common/icons.html" import svg %}

{% block content %}
<div class="stage">
  <div class="glyph">{{ svg('warning') }}</div>
  <h1 class="metro-title">{{ heading }}</h1>
  <p class="lede">{{ heading }} has not detected a valid Wine prefix. {{ heading }} cannot continue.</p>
  <p class="lede">You may target a prefix in Settings NOW.</p>
  <div class="commands">
    <a class="cmd fill" href="/settings">Settings</a>
    <a class="cmd" href="/{{ kind }}/canceled">Cancel</a>
  </div>
</div>
{% endblock %}
